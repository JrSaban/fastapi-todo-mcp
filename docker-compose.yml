x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  volumes:
    # Montage de volume pour activer le rechargement à chaud (Hot-Reload) lors du développement local
    - ./src:/app/src
    - ./.env:/app/.env
  env_file:
    - .env
  environment:
    # En environnement Docker, l'hôte de la BDD est le nom du service ("db") et REDIS
    - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-todo_db}
    - REDIS_URL=redis://redis:6379/0
    # The MCP container's fixed address (services.mcp): the only proxy the API trusts here
    - TRUSTED_PROXIES=["172.30.0.10"]
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  api:
    <<: *app
    container_name: todo_api
    ports:
      - "8000:8000"

  db:
    image: postgres:16-alpine
    container_name: todo_db
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-todo_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-todo_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: todo_mcp
    profiles: [ "mcp" ]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      TODO_API_URL: http://api:8000/api/v1
      MCP_SERVICE_KEY: ${MCP_SERVICE_KEY:-}
    networks:
      default:
        ipv4_address: 172.30.0.10
    depends_on:
      - api

  redis:
    image: redis:8-alpine
    container_name: todo_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    <<: *app
    container_name: todo_worker
    command: [ "uv", "run", "taskiq", "worker", "src.core.broker:broker", "--fs-discover", "--reload" ]

  scheduler:
    <<: *app
    container_name: todo_scheduler
    command: [ "uv", "run", "taskiq", "scheduler", "src.core.broker:scheduler", "--fs-discover" ]

volumes:
  postgres_data:
    name: todo_postgres_data
  redis_data:
    name: todo_redis_data

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          ip_range: 172.30.0.128/25
