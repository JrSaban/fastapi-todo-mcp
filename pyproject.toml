[project]
name = "python-agentic-lab"
version = "0.1.0"
description = "FastAPI To-Do List API with Clean Architecture"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.128.8",
    "pydantic-settings>=2.11.0",
    "pyjwt>=2.14.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "structlog>=26.1.0",
    "taskiq[reload]>=0.13.0",
    "taskiq-redis>=1.2.4",
    "uvicorn[standard]>=0.39.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "fakeredis>=2.38.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "rich>=15.0.0",
    "ruff>=0.16.4",
]
mcp = [
    "httpx>=0.28.1",
    "mcp>=2.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
default-groups = ["dev", "mcp"]